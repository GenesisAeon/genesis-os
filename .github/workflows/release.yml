# =============================================================================
# GenesisAeon — Canonical Release Workflow (v1.0.0)
# =============================================================================
#
# This workflow is the reference template shared across the 48 repositories
# of the GenesisAeon ecosystem (see release_map.yml in genesis-os). It builds
# a Python wheel + sdist, runs the test matrix, and conditionally publishes
# to PyPI / Test PyPI and Zenodo / Zenodo Sandbox depending on the pushed tag.
#
# -----------------------------------------------------------------------------
# Trigger
# -----------------------------------------------------------------------------
# Runs only when a tag matching `v*.*.*` is pushed, e.g.:
#   v1.0.0          -> production release (PyPI + Zenodo production)
#   v1.0.0-rc1      -> canary release (Test PyPI + Zenodo sandbox)
#   v1.0.0-alpha1   -> canary release (Test PyPI + Zenodo sandbox)
#   v1.0.0-beta1    -> canary release (Test PyPI + Zenodo sandbox)
#
# -----------------------------------------------------------------------------
# Pipeline stages
# -----------------------------------------------------------------------------
#   1. build              -> wheel + sdist via `python -m build`
#   2. test               -> pytest matrix across Python 3.10 / 3.11 / 3.12
#   3. publish-pypi       -> production tags only, publishes to PyPI
#   4. publish-testpypi   -> rc/alpha/beta tags only, publishes to Test PyPI
#   5. github-release     -> creates a GitHub Release with auto-generated notes
#                             and attaches dist/* artifacts
#   6. publish-zenodo            -> production tags only, archives on Zenodo
#   7. publish-zenodo-sandbox    -> rc/alpha/beta tags only, archives on Zenodo
#                                    Sandbox
#
# -----------------------------------------------------------------------------
# Required repository / environment secrets
# -----------------------------------------------------------------------------
#   PYPI_API_TOKEN      - API token for https://pypi.org (production releases)
#   TEST_PYPI_API_TOKEN - API token for https://test.pypi.org (canary releases)
#   ZENODO_TOKEN        - Personal access token for https://zenodo.org
#   ZENODO_SANDBOX_TOKEN- Personal access token for https://sandbox.zenodo.org
#
# These should be configured as GitHub Environment secrets on the
# "production" and "canary" environments respectively, so that production
# publishing can additionally be gated by required reviewers.
#
# -----------------------------------------------------------------------------
# zenodo.json
# -----------------------------------------------------------------------------
# The Zenodo publish jobs read `concept_doi` from `zenodo.json` in the repo
# root. This file establishes the "concept" DOI that groups all versions of
# a package together on Zenodo. If `concept_doi` is null/absent, the upload
# step creates a brand-new concept deposition and the resulting concept DOI
# should be back-filled into `zenodo.json` by the maintainers.
#
# =============================================================================

name: Release

on:
  push:
    tags:
      # v*.*.* does not match semver tags in GHA glob — use v* (see SESSION_HANDOFF)
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # No id-token: write here on purpose. pypa/gh-action-pypi-publish prefers
  # OIDC Trusted Publishing over the supplied `password:` whenever an OIDC
  # token is available (i.e. whenever this permission is granted) - and this
  # repo's GitHub Environments are not registered as PyPI Trusted Publishers,
  # so granting it just makes every publish step fail with
  # "invalid-publisher: valid token, but no corresponding publisher" instead
  # of using the PYPI_API_TOKEN/TEST_PYPI_API_TOKEN Environment secrets that
  # are actually configured. See mandala/HANDOVER.md for the option to
  # switch to Trusted Publishing ecosystem-wide instead.

env:
  # A tag is considered a "canary" release if it contains rc, alpha, or beta.
  # Otherwise it is treated as a "production" release.
  IS_CANARY: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build: produce wheel + sdist, shared by all downstream jobs.
  # ---------------------------------------------------------------------------
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 2. Test: run the pytest matrix across supported Python versions.
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q

  # ---------------------------------------------------------------------------
  # 3a. Publish to PyPI (production tags only: vX.Y.Z without rc/alpha/beta)
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI (production)
    needs: [build, test]
    if: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ---------------------------------------------------------------------------
  # 3b. Publish to Test PyPI (canary tags only: vX.Y.Z-rc*/alpha*/beta*)
  # ---------------------------------------------------------------------------
  publish-testpypi:
    name: Publish to Test PyPI (canary)
    needs: [build, test]
    if: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/

  # ---------------------------------------------------------------------------
  # 4. GitHub Release: created after the appropriate PyPI publish step.
  # ---------------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    needs: [publish-pypi, publish-testpypi]
    if: ${{ always() && (needs.publish-pypi.result == 'success' || needs.publish-testpypi.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ env.IS_CANARY == 'true' }}

  # ---------------------------------------------------------------------------
  # 5a. Publish to Zenodo production (production tags only)
  # ---------------------------------------------------------------------------
  publish-zenodo:
    name: Publish to Zenodo (production)
    needs: github-release
    if: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Read concept_doi from zenodo.json
        id: zenodo-meta
        run: |
          if [ -f .zenodo.json ]; then
            CONCEPT_DOI=$(python -c "import json; print(json.load(open('.zenodo.json')).get('concept_doi') or '')")
          elif [ -f zenodo.json ]; then
            CONCEPT_DOI=$(python -c "import json; print(json.load(open('zenodo.json')).get('concept_doi') or '')")
          else
            CONCEPT_DOI=""
          fi
          echo "concept_doi=${CONCEPT_DOI}" >> "$GITHUB_OUTPUT"

      - name: Sync .zenodo.json version from release tag
        run: |
          pip install -e .
          python scripts/sync_zenodo_version.py --tag "${{ github.ref_name }}"

      - name: Archive release on Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          CONCEPT_DOI: ${{ steps.zenodo-meta.outputs.concept_doi }}
        run: |
          echo "Archiving ${{ github.ref_name }} on Zenodo (production)"
          echo "Concept DOI: ${CONCEPT_DOI:-<none, new deposition will be created>}"
          python -c "from genesis_os.tools.release_version import parse_release_tag as p; print('Zenodo version:', p('${{ github.ref_name }}'))"
        # Activate once ZENODO_TOKEN is configured on the production environment:
        # uses: zenodraft/action@main
        # with:
        #   concept-doi: ${{ steps.zenodo-meta.outputs.concept_doi }}
        #   token: ${{ secrets.ZENODO_TOKEN }}

  # ---------------------------------------------------------------------------
  # 5b. Publish to Zenodo Sandbox (canary tags only)
  # ---------------------------------------------------------------------------
  publish-zenodo-sandbox:
    name: Publish to Zenodo (sandbox / canary)
    needs: github-release
    if: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Read concept_doi from zenodo.json
        id: zenodo-meta
        run: |
          if [ -f .zenodo.json ]; then
            CONCEPT_DOI=$(python -c "import json; print(json.load(open('.zenodo.json')).get('concept_doi') or '')")
          elif [ -f zenodo.json ]; then
            CONCEPT_DOI=$(python -c "import json; print(json.load(open('zenodo.json')).get('concept_doi') or '')")
          else
            CONCEPT_DOI=""
          fi
          echo "concept_doi=${CONCEPT_DOI}" >> "$GITHUB_OUTPUT"

      - name: Sync .zenodo.json version from release tag
        run: |
          pip install -e .
          python scripts/sync_zenodo_version.py --tag "${{ github.ref_name }}"

      - name: Archive release on Zenodo Sandbox
        env:
          ZENODO_SANDBOX_TOKEN: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
          CONCEPT_DOI: ${{ steps.zenodo-meta.outputs.concept_doi }}
        run: |
          echo "Archiving ${{ github.ref_name }} on Zenodo Sandbox (canary)"
          echo "Concept DOI: ${CONCEPT_DOI:-<none, new sandbox deposition will be created>}"
        # Activate once ZENODO_SANDBOX_TOKEN is configured on the canary environment:
        # uses: zenodraft/action@main
        # with:
        #   concept-doi: ${{ steps.zenodo-meta.outputs.concept_doi }}
        #   token: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
        #   sandbox: true
